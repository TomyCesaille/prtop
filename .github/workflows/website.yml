name: Website

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # withastro/action takes no version file, and a bare major resolves to
      # whatever the runner has, which can lag behind Astro's minimum.
      - id: node
        run: echo "version=$(cat docs/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: docs/
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site
      id-token: write # prove to Pages that this workflow made the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
