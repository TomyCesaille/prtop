[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prtop"
dynamic = ["version"]
description = "One terminal table of the merge requests assigned to you, from review to production."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joris La Cancellera" }]
requires-python = ">=3.14"
dependencies = []
keywords = ["gitlab", "merge-requests", "pull-requests", "code-review", "deployments", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
prtop = "prtop.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prtop.__version__" }

[tool.setuptools.packages.find]
include = ["prtop*"]

[tool.ruff]
line-length = 110
target-version = "py314"
