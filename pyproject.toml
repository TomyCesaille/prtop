[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prtop"
dynamic = ["version"]
description = "One terminal table of your merge requests and pull requests, from review to production."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joris La Cancellera" }]
requires-python = ">=3.14"
dependencies = []
keywords = ["gitlab", "github", "merge-requests", "pull-requests", "code-review", "deployments", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/TomyCesaille/prtop"
Issues = "https://github.com/TomyCesaille/prtop/issues"
Changelog = "https://github.com/TomyCesaille/prtop/blob/main/CHANGELOG.md"

[project.scripts]
prtop = "prtop.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prtop.__version__" }

[tool.setuptools.packages.find]
include = ["prtop*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.coverage.run]
branch = true
source = ["prtop"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
